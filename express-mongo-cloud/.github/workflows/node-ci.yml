name: Node CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: express-mongo-cloud/package-lock.json
      - name: Install dependencies
        working-directory: express-mongo-cloud
        run: npm ci
      - name: Run tests (if present)
        working-directory: express-mongo-cloud
        run: npm test --if-present
